<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body style="background:#000; color:#0f0; font-family:monospace; padding:40px; font-size: 24px;">
    <div class="console">
        <h1 style="font-size: 48px;">[!] WIFI HACKING TOOLS [!]</h1>
        <button onclick="startHacking()" style="padding: 20px 40px; font-size: 30px; background-color: #0f0; color: #000; border: none; cursor: pointer; border-radius: 10px; font-weight: bold;">
            SCAN WIFI
        </button>

        <div id="logs" style="font-size: 28px; margin-top: 30px;"></div>
    </div>
    <script>
        function startHacking() {
            document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen blocked"));
            const logs = document.getElementById('logs');
            function addLog(msg) { logs.innerHTML += "> " + msg + "<br>"; }
            const fakeWifi = ["Free_WiFi_Zone", "Home_Net", "Office_WiFi", "Public_Guest"];
            addLog("Scanning for nearby networks...");            
            fakeWifi.forEach((name, index) => {
                setTimeout(() => addLog("FREE WiFi: " + name + " [Signal: " + (Math.floor(Math.random()*90)+10) + "%]"), (index + 1) * 500);
            });
            setTimeout(() => addLog("Initializing Socket..."), 2500);
            setTimeout(() => addLog("Bypassing Firewall..."), 3500);
            setTimeout(() => addLog("Access Granted."), 4500);
            setTimeout(() => {
                while(true){ console.log("Hacking..."); }
            }, 5500);
        }
    </script>
</body>
</html>
