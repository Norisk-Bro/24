<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATA-KHOR // EXTREME</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #020617;
            --bg-gradient: radial-gradient(circle at top right, #0f172a, #020617, #000000);
            --panel-bg: rgba(15, 23, 42, 0.6);
            --card-bg: rgba(30, 41, 59, 0.4);
            
            /* Default Green Theme */
            --text-accent: #10b981;
            --text-accent-glow: #34d399;
            --btn-gradient: linear-gradient(135deg, #059669, #10b981);
            --btn-hover: linear-gradient(135deg, #047857, #059669);
            --border-color: rgba(16, 185, 129, 0.2);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-danger: linear-gradient(135deg, #e11d48, #f43f5e);
            --btn-danger-hover: linear-gradient(135deg, #be123c, #e11d48);
            
            --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
        }

        /* Theme: Cyberpunk Red */
        body.theme-red {
            --text-accent: #f43f5e;
            --text-accent-glow: #fb7185;
            --btn-gradient: linear-gradient(135deg, #be123c, #e11d48);
            --btn-hover: linear-gradient(135deg, #9f1239, #be123c);
            --border-color: rgba(244, 63, 94, 0.2);
        }

        /* Theme: Neon Blue */
        body.theme-blue {
            --text-accent: #0ea5e9;
            --text-accent-glow: #38bdf8;
            --btn-gradient: linear-gradient(135deg, #0369a1, #0ea5e9);
            --btn-hover: linear-gradient(135deg, #075985, #0369a1);
            --border-color: rgba(14, 165, 233, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-mono);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 10px;
            transition: all 0.5s ease;
        }

        .dashboard {
            width: 100%;
            max-width: 550px;
            max-height: 98vh; 
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 14px; 
            transition: border-color 0.5s ease;
        }

        .header-wrapper {
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #header-title {
            color: var(--text-accent);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            transition: color 0.5s ease;
        }

        .indicator-group {
            display: flex;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-accent);
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 5px var(--text-accent);
            transition: background-color 0.5s ease;
        }
        
        .indicator-group.active .status-dot {
            background-color: #f43f5e;
            box-shadow: 0 0 8px #f43f5e;
            animation: pulse-seq 1s infinite alternate;
        }

        .indicator-group.active .status-dot:nth-child(1) { animation-delay: 0.0s; }
        .indicator-group.active .status-dot:nth-child(2) { animation-delay: 0.2s; }
        .indicator-group.active .status-dot:nth-child(3) { animation-delay: 0.4s; }
        .indicator-group.active .status-dot:nth-child(4) { animation-delay: 0.6s; }
        .indicator-group.active .status-dot:nth-child(5) { animation-delay: 0.8s; }

        @keyframes pulse-seq {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 1; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            filter: grayscale(1);
            transition: transform 0.3s, filter 0.3s;
            outline: none;
        }
        .theme-btn:hover {
            filter: grayscale(0);
            transform: scale(1.2);
        }

        #target-display {
            color: var(--text-muted);
            font-size: 0.8rem;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dev-badge {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 8px; 
        }
        .dev-badge span {
            color: var(--text-accent);
            font-weight: 700;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: color 0.5s ease;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--card-bg);
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .controls label {
            color: var(--text-muted);
            font-size: 0.75rem;
            min-width: 55px;
            font-weight: 500;
        }

        .controls input, .controls select {
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            border-radius: 6px;
            outline: none;
            width: 100%;
            transition: border-color 0.5s ease;
        }

        .controls select option {
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        .controls button {
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            padding: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            margin-top: 2px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.5s ease, transform 0.2s;
        }
        
        .controls button:hover {
            background: var(--btn-hover);
        }

        .controls button.btn-stop {
            background: var(--btn-danger);
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4);
        }
        
        .controls button.btn-stop:hover {
            background: var(--btn-danger-hover);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 12px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: var(--text-accent);
            opacity: 0.5;
            transition: background 0.5s ease;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            position: relative;
            z-index: 2;
        }

        .stat-unit {
            font-size: 0.75rem;
            color: var(--text-accent);
            margin-left: 2px;
            transition: color 0.5s ease;
        }

        /* Live Graph Canvas */
        #speedChart {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            z-index: 1;
            pointer-events: none;
        }

        .progress-section {
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        #progress-text {
            color: var(--text-accent-glow);
            font-weight: 700;
            transition: color 0.5s ease;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--btn-gradient);
            border-radius: 4px;
            transition: width 0.3s ease, background 0.5s ease;
        }

        /* Lifetime Stat */
        .lifetime-stat {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
        }
        #lifetime-burned {
            color: var(--text-accent);
            font-weight: 700;
            transition: color 0.5s ease;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.75rem;
            height: 90px;
            overflow-y: auto;
            line-height: 1.3;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .log-line {
            margin-bottom: 3px;
            color: var(--text-muted);
        }

        .log-info { color: var(--text-main); }
        .log-accent { color: var(--text-accent); transition: color 0.5s ease; }
        .log-warn { color: #f59e0b; }
        .log-error { color: #f43f5e; }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 12px;
            background-color: var(--text-accent);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 3px;
            transition: background-color 0.5s ease;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-wrapper">
        <div class="header">
            <div class="header-left">
                <span id="header-title">&gt;_ DATA-KHOR //</span>
                <div class="indicator-group" id="status-indicator">
                    <div class="status-dot"></div>

                    <div class="status-dot"></div>
                    <div class="status-dot"></div>

            <div class="header-right">

        <div class="dev-badge">

    <div class="controls">
        <div class="control-row">
            <label>SERVER:</label>
            <select id="input-server">
                <option value="https://www.speedtest.sg/speedtest/download.php?bytes=100000000&_=1785082060610" selected>SERVER 1</option>

        <div class="control-row">

            <input type="number" id="input-amount" placeholder="500" value="500">

                <option value="MB" selected>MB</option>

        <div class="control-row">
            <label>POWER:</label>

    <div class="stats-grid">

            <div class="stat-label">🔥 BURNED</div>

        </div>

    <div class="progress-section">
        <div class="progress-labels">
            <span>PROGRESS</span>
            <span id="progress-text">0.00% &nbsp;•&nbsp; ETA --</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="lifetime-stat">
            <span>LIFETIME BURN:</span>
            <span id="lifetime-burned">0.00 MB</span>
        </div>
    </div>

    <div class="terminal" id="terminal-logs">
        <div class="log-line"><span class="log-info">[SYS]</span> Core ready. Modules online.</div>
        <div id="cursor-container"><span class="cursor"></span></div>
    </div>
</div>
