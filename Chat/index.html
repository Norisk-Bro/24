<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer SAJIB - Pro Multi-Media Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #entryScreen { position: fixed; inset: 0; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 20000; }
        .premium-card { background: white; width: 90%; max-width: 380px; padding: 30px 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        
        @keyframes rgbBorder {
            0% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
            50% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff; }
            100% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
        }
        .entry-logo { width: 180px; height: 180px; border-radius: 50%; border: 4px solid; margin: 0 auto 20px; display: block; object-fit: cover; animation: rgbBorder 3s linear infinite; }

        @keyframes rgbText { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .lock-title { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #9c27b0, #f44336, #ffeb3b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgbText 3s linear infinite; margin-bottom:25px; text-transform: uppercase; }

        .p-input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 15px; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; background: #fff !important; color: #000 !important; }
        .p-btn { width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; background: linear-gradient(to right, #e91e63, #9c27b0, #673ab7); text-transform: uppercase; }

        .chat-container { display: none; width: 100%; max-width: 450px; height: 98vh; background: #111b21; border-radius: 20px; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a3942; position: relative; }
        .header { background: #202c33; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a3942; z-index: 10; }
        @keyframes rgbTwo { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .dev-name { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; background: linear-gradient(to right, #00ffff, #ff00ff, #00ffff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgbTwo 4s linear infinite; }
        
        .header-btns { display: flex; gap: 4px; }
        .h-btn { padding: 6px 10px; border-radius: 6px; border: none; color: white; font-weight: bold; font-size: 10px; cursor: pointer; text-decoration: none; background-size: 400% 400%; animation: rgbTwo 3s ease infinite; }
        .n-btn { background: #f1c40f; } .c-btn { background: #2ecc71; } .a-btn { background: #23a6d5; } .cl-btn { background: #ff4757; }
        
        .online-info { font-size: 10px; color: #00ff00; font-weight: bold; display: block; margin-top: 2px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background-image: url('https://g.top4top.io/p_37468pjz10.jpeg'); background-size: cover; background-position: center; padding-bottom: 160px; }
        
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); display: flex; flex-direction: column; position: relative; }
        
        .sent { background: #0084ff; align-self: flex-end; }
        .received { background: rgba(20, 20, 25, 0.95); align-self: flex-start; }
        .msg.seen { background: #ffffff !important; }
        
        .msg-text { font-size: 16px; font-weight: bold; color: #00ffff; word-wrap: break-word; }
        .sent .msg-text { color: #ffffff; }
        
        .msg.seen .msg-text { color: #000000 !important; }
        .msg.seen .time-tag { color: #555; }

        .time-tag { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; color: #fff; }
        .seen-by { font-size: 9px; color: #000; font-weight: bold; margin-top: 2px; text-align: right; }

        .input-area { display: flex; padding: 8px 12px; background: #202c33; gap: 8px; align-items: center; position: absolute; bottom: 80px; left: 12px; right: 12px; z-index: 20; border-radius: 35px; box-shadow: 0 8px 25px rgba(0,0,0,0.8); border: 1px solid #37414b; }
        .blue-icon { background: none; border: none; color: #0084ff; cursor: pointer; display: flex; align-items: center; padding: 0; transition: 0.3s; }
        .input-wrapper { flex: 1; background: #333; border-radius: 20px; display: flex; align-items: center; padding: 0 12px; }
        .input-wrapper input { flex: 1; background: transparent; border: none; padding: 10px 0; color: white; outline: none; font-size: 14px; }

        .img-modal { display: none; position: fixed; z-index: 31000; inset: 0; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; }
        .img-modal img, .img-modal video { max-width: 95%; max-height: 85%; border-radius: 10px; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 50px; font-weight: bold; cursor: pointer; z-index: 32000; }
        
        .file-link { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; text-decoration: none; color: white; border: 1px solid rgba(255,255,255,0.2); }
        .file-icon { font-size: 24px; }
        .file-name { font-size: 12px; word-break: break-all; }
        .recording { color: #ff4757 !important; transform: scale(1.2); }
    </style>
</head>
<body>

<div id="entryScreen">
    <div class="premium-card">
        <img src="https://d.top4top.io/p_3744hq3y40.png" class="entry-logo">
        <div class="lock-title">Login Access</div>
        <input type="password" id="passInput" class="p-input" placeholder="Enter Password">
        <input type="text" id="userNameInput" class="p-input" placeholder="Enter Your Nickname">
        <button class="p-btn" id="loginBtn" onclick="validateAndLogin()">Login & Chat</button>
    </div>
</div>

<div id="mediaViewer" class="img-modal">
    <span class="close-modal" onclick="closeViewer()">&times;</span>
    <img id="fullImg" src="" style="display:none">
    <video id="fullVid" controls style="display:none"></video>
</div>

<div class="chat-container" id="mainChat">
    <div class="header">
        <div>
            <span class="dev-name">Developer SAJIB</span>
            <span id="onlineDisplay" class="online-info">Online: 0</span>
        </div>
        <div class="header-btns">
            <button class="h-btn n-btn" onclick="document.getElementById('noticeBox').style.display='flex'">Notice</button>
            <button class="h-btn c-btn" onclick="window.open('https://meet.jit.si/sajib_'+Math.floor(Math.random()*1000),'_blank')">Call</button>
            <a href="https://www.facebook.com/share/18dPrvvhoy/" target="_blank" class="h-btn a-btn">Admin</a>
            <button class="h-btn cl-btn" onclick="if(confirm('Delete All SMS?'))database.ref('messages').remove()">Clear</button>
        </div>
    </div>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="file" id="camInput" accept="image/*" capture="camera" style="display: none;" onchange="handleFile(this)">
        <button class="blue-icon" onclick="document.getElementById('camInput').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M4,4H7L9,2H15L17,4H20A2,2 0 0,1 22,6V18A2,2 0 0,1 20,20H4A2,2 0 0,1 2,18V6A2,2 0 0,1 4,4M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z"/></svg></button>
        
        <input type="file" id="fileInput" accept="*/*" style="display: none;" onchange="handleFile(this)">
        <button class="blue-icon" onclick="document.getElementById('fileInput').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19,5V19H5V5H19M19,3H5C3.9,3 3,3.9 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/></svg></button>
        
        <button class="blue-icon" id="micBtn" onclick="toggleRecording()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
        <div class="input-wrapper"><input type="text" id="msgInput" placeholder="Message" autocomplete="off"></div>
        <button class="blue-icon" id="sendBtn" onclick="sendMessage()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" id="sendIcon"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    </div>
</div>

<div id="noticeBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:30000; justify-content:center; align-items:center;" onclick="this.style.display='none'">
    <div style="background:#111b21; padding:25px; border-radius:15px; border:2px solid #38bdf8; text-align:center;" onclick="event.stopPropagation()">
        <h2 style="color:#00ffff;">🔔 Notice</h2>
        <p style="color:white; font-weight:bold;">স্বাগতম সজীবের চ্যাট অ্যাপে! <br> সবাইকে ভদ্রভাবে কথা বলার অনুরোধ রইলো।</p>
    </div>
</div>
