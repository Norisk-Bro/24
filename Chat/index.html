<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer SAJIB - Pro Multi-Media Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #entryScreen { position: fixed; inset: 0; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 20000; }
        .premium-card { background: white; width: 90%; max-width: 380px; padding: 30px 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        
        @keyframes rgbBorder {
            0% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
            50% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff; }
            100% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
        }
        .entry-logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid; margin: 0 auto 10px; display: block; object-fit: cover; animation: rgbBorder 3s linear infinite; }

        @keyframes rgbText { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .lock-title { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #9c27b0, #f44336, #ffeb3b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgbText 3s linear infinite; margin-bottom:25px; text-transform: uppercase; }

        .p-input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 15px; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; background: #fff !important; color: #000 !important; }
        .p-btn { width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; background: linear-gradient(to right, #e91e63, #9c27b0, #673ab7); text-transform: uppercase; }

        .chat-container { display: none; width: 100%; max-width: 450px; height: 98vh; background: #111b21; border-radius: 20px; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a3942; position: relative; }
        .header { background: #202c33; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a3942; z-index: 10; }
        @keyframes rgbTwo { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .dev-name { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; background: linear-gradient(to right, #00ffff, #ff00ff, #00ffff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgbTwo 4s linear infinite; }
        
        .menu-btn { background: none; border: none; color: #aebac1; font-size: 24px; cursor: pointer; padding: 5px; }
        .dropdown-menu { display: none; position: absolute; top: 55px; right: 10px; background: #233138; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 100; min-width: 180px; flex-direction: column; padding: 8px 0; border: 1px solid #2a3942; }
        .dropdown-menu.active { display: flex; }
        
        .h-btn { padding: 10px 15px; border: none; color: white; font-weight: bold; font-size: 13px; cursor: pointer; text-decoration: none; display: block; text-align: left; background: transparent; transition: 0.3s; }
        .h-btn:hover { background: #182229; }
        
        .on-btn { color: #00ff00; } .cl-btn { color: #ff4757; } .n-btn { color: #f1c40f; } .br-btn { color: #ff00ff; } .m-btn { color: #00ffff; }

        .online-info { font-size: 10px; color: #00ff00; font-weight: bold; display: block; margin-top: 2px; }
        .typing-info { font-size: 10px; color: #38bdf8; font-weight: bold; display: block; margin-top: 2px; height: auto; min-height: 12px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background-image: url('https://g.top4top.io/p_37477r26x0.jpg'); background-size: cover; background-position: center; padding-bottom: 160px; }
        
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); display: flex; flex-direction: column; position: relative; cursor: pointer; }
        .sent { background: #0084ff; align-self: flex-end; }
        .received { background: rgba(20, 20, 25, 0.95); align-self: flex-start; }
        .msg.seen { background: #ffffff !important; }
        .msg.seen .msg-text { color: #000 !important; }
        .msg-text { font-size: 16px; font-weight: bold; color: #00ffff; word-wrap: break-word; }
        .sent .msg-text { color: #ffffff; }

        .time-tag { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; color: #fff; }
        .seen-by { font-size: 9px; color: #000; font-weight: bold; margin-top: 2px; text-align: right; }

        .input-area { display: flex; padding: 8px 12px; background: #202c33; gap: 8px; align-items: center; position: absolute; bottom: 80px; left: 12px; right: 12px; z-index: 20; border-radius: 35px; box-shadow: 0 8px 25px rgba(0,0,0,0.8); border: 1px solid #37414b; }
        .blue-icon { background: none; border: none; color: #0084ff; cursor: pointer; display: flex; align-items: center; padding: 0; transition: 0.3s; }
        .input-wrapper { flex: 1; background: #333; border-radius: 20px; display: flex; align-items: center; padding: 0 12px; }
        .input-wrapper input { flex: 1; background: transparent; border: none; padding: 10px 0; color: white; outline: none; font-size: 14px; }

        .reaction-box { display: flex; gap: 5px; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 20px; position: absolute; top: -40px; left: 10px; z-index: 1000; display: none; border: 1px solid #38bdf8; }
        .msg:hover .reaction-box { display: flex; }
        .react-emoji { font-size: 18px; cursor: pointer; transition: 0.2s; }
        .msg-reactions { display: flex; gap: 2px; margin-top: 2px; }
        .react-tag { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 1px 4px; font-size: 10px; }

        /* Real-time User Info Card Styles */
        #infoCard { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 40000; justify-content: center; align-items: center; }
        .card-body { background: #111b21; padding: 20px; border-radius: 20px; border: 2px solid #38bdf8; width: 280px; text-align: center; color: white; }

        .avatar-chat { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; border: 1px solid #38bdf8; }
        .avatar-preview-box { width: 50px; height: 50px; border-radius: 50%; border: 2px dashed #9c27b0; margin: 0 auto 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #avatarPreviewImg { width: 100%; height: 100%; object-fit: cover; display: none; }

        #broadcastDisplay { background: #ff4757; color: white; font-weight: bold; font-size: 12px; padding: 5px; text-align: center; display: none; z-index: 100; }
        .pvt-tag { color: #ff4757; font-size: 9px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
        .god-tag { color: #f1c40f; font-size: 9px; font-weight: 900; }

        .img-modal { display: none; position: fixed; z-index: 31000; inset: 0; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; }
        .img-modal img, .img-modal video { max-width: 95%; max-height: 85%; border-radius: 10px; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 50px; font-weight: bold; cursor: pointer; z-index: 32000; }
        
        .recording { color: #ff4757 !important; transform: scale(1.2); }
        .kick-btn { background: #ff4757; color: white; border: none; padding: 2px 6px; border-radius: 4px; font-size: 9px; cursor: pointer; margin-left: 8px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>

<div id="entryScreen">
    <div class="premium-card">
        <!-- Original Logo Restored -->
        <img src="https://d.top4top.io/p_3744hq3y40.png" class="entry-logo">
        
        <!-- Gallery Avatar System below Original Logo -->
        <div class="avatar-preview-box" onclick="document.getElementById('avatarFile').click()">
            <span id="avatarText" style="font-size: 10px; color: #9c27b0;">Set Photo</span>
            <img id="avatarPreviewImg" src="">
        </div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none;" onchange="previewAvatar(this)">

<div id="infoCard" onclick="this.style.display='none'">

</div>
